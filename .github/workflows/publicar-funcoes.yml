# ===========================================================================
# AgendaPro — publicar as funções do servidor no Supabase, sem computador
#
# POR QUE ISTO EXISTE
# As mensagens da agenda e o pagamento pelo Mercado Pago passam por funções
# que rodam NO SERVIDOR do Supabase (supabase/functions/). Publicá-las pedia a
# CLI do Supabase num computador. Aqui é um botão: GitHub → Actions →
# "Publicar as funções (WhatsApp e Mercado Pago)" → Run workflow. E roda
# sozinho quando uma dessas funções muda no `main`.
#
# O QUE PRECISA, UMA VEZ
# Um token de acesso do Supabase guardado como segredo DO REPOSITÓRIO:
#   Supabase → Account → Access Tokens → Generate new token
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#     Name:   SUPABASE_ACCESS_TOKEN
#     Secret: o token
# Sem ele o trabalho para no primeiro passo e diz isso — não quebra nada.
#
# ⚠ OS SEGREDOS NÃO PASSAM POR AQUI. WHATSAPP_TOKEN, WHATSAPP_PHONE_ID,
# META_APP_SECRET, WHATSAPP_VERIFY_TOKEN, CRON_SEGREDO, MP_ACCESS_TOKEN,
# MP_WEBHOOK_SECRET e companhia moram só no Supabase (Edge Functions →
# Secrets). Este arquivo publica código; não vê, não grava e não imprime
# credencial nenhuma.
# ===========================================================================
name: Publicar as funções (WhatsApp e Mercado Pago)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/enviar-notificacoes/**'
      - 'supabase/functions/status-whatsapp/**'
      - 'supabase/functions/enviar-campanha/**'
      - 'supabase/functions/criar-cobranca/**'
      - 'supabase/functions/webhook-mp/**'
      - 'supabase/functions/assinar-cartao/**'
      - 'supabase/functions/cancelar-cartao/**'
      # Texto de ajuda (MODELOS.md, README.md) não é código: mudar não publica.
      - '!supabase/functions/**/*.md'

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # O identificador do projeto. Não é segredo: já está no config.js, na
      # URL que o navegador da cliente usa.
      PROJETO: ialjrnighxntuirzmppt
    steps:
      - name: O token do Supabase está guardado?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no repositório (Settings → Secrets and variables → Actions). Nada foi publicado."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # As mensagens da agenda: confirmação, lembrete, resumo, aviso à equipe.
      # SEM verificação de JWT, de propósito: quem chama é o `pg_cron`, que não
      # manda token do Supabase — com a verificação ligada o gateway respondia
      # 401 "Missing authorization header" e nada saía. A porta é o cabeçalho
      # x-cron-segredo, conferido dentro da função, que recusa tudo se o
      # segredo CRON_SEGREDO não estiver configurado.
      - name: enviar-notificacoes
        run: supabase functions deploy enviar-notificacoes --project-ref "$PROJETO" --no-verify-jwt

      # O retorno da Meta (entregue, lido, falhou). SEM verificação de JWT, de
      # propósito: a Meta chama sem token do Supabase — quem guarda a porta é a
      # assinatura com o META_APP_SECRET, conferida dentro da função.
      - name: status-whatsapp
        run: supabase functions deploy status-whatsapp --project-ref "$PROJETO" --no-verify-jwt

      # As campanhas (promoção, aniversário). Só mandam quando há campanha.
      - name: enviar-campanha
        run: supabase functions deploy enviar-campanha --project-ref "$PROJETO"

      # ── O PAGAMENTO PELO MERCADO PAGO (webhook-mp/README.md) ──────────────
      # Chamadas pelo painel, COM o token de sessão do dono: é ele que diz
      # quem está pedindo. Por isso a verificação de JWT fica LIGADA.
      - name: criar-cobranca
        run: supabase functions deploy criar-cobranca --project-ref "$PROJETO"
      - name: assinar-cartao
        run: supabase functions deploy assinar-cartao --project-ref "$PROJETO"
      - name: cancelar-cartao
        run: supabase functions deploy cancelar-cartao --project-ref "$PROJETO"

      # O aviso de pagamento. SEM verificação de JWT, de propósito: o Mercado
      # Pago chama sem token do Supabase — quem guarda a porta é a assinatura
      # HMAC com o MP_WEBHOOK_SECRET, conferida dentro da função, que recusa
      # tudo se o segredo não estiver configurado. Só ESTA das quatro.
      - name: webhook-mp
        run: supabase functions deploy webhook-mp --project-ref "$PROJETO" --no-verify-jwt
